name: Build Windows (MSVC), Android y Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 1) Utiliza Visual Studio 2022 (MSVC) preinstalado en el runner
      - name: Build Windows release
        run: flutter build windows --release

      # 2) Genera los 4 assets MSIX a partir del icono de la app (System.Drawing: sin dependencias externas en el runner)
      - name: Generate MSIX assets
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $base = Join-Path $env:GITHUB_WORKSPACE 'assets/icon.png'
          $dst  = Join-Path $env:GITHUB_WORKSPACE 'windows/packaging/assets'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $src = [System.Drawing.Image]::FromFile($base)
          @{ 'Square150x150Logo.png'=150,150; 'Square44x44Logo.png'=44,44; 'Wide310x150Logo.png'=310,150; 'StoreLogo.png'=50,50 }.GetEnumerator() | ForEach-Object {
            $bmp = New-Object System.Drawing.Bitmap($_.Value[0], $_.Value[1])
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($src, 0, 0, $_.Value[0], $_.Value[1])
            $bmp.Save((Join-Path $dst $_.Key), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $src.Dispose()

      # 3) Busca "Windows Kits" bin (MakeAppx + signtool) en su version mayor
      - name: Locate MakeAppx + signtool
        shell: powershell
        id: kit
        run: |
          $kitDir = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
                    Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } |
                    Sort-Object Name -Descending | Select-Object -First 1
          $x64 = Join-Path $kitDir.FullName 'x64'
          Write-Output "makeappx=$x64\makeappx.exe"  | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "signtool=$x64\signtool.exe"  | Out-File -FilePath $env:GITHUB_ENV -Append

      # 4) Genera certificado autofirmado dev (default) y firma el MSIX
      - name: Create MSIX and self-sign
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=MusicaDev" -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA -KeyLength 2048 -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(2) -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfx = Join-Path $env:GITHUB_WORKSPACE 'windows/packaging/musica-dev.pfx'
          $pass = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes((New-Guid)))
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null

          # Staging MSIX: exe+DLLs+data del runner Release + manifest + assets
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/msix/stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE 'windows/packaging/assets') $stage
          Copy-Item -Force (Join-Path $env:GITHUB_WORKSPACE 'windows/packaging/AppxManifest.xml') $stage
          Copy-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release/*') $stage

          & $env:makeappx pack /d $stage /p windows/packaging/musica-1.0.0.msix /o
          & $env:signtool sign /f $pfx /p $pass /fd SHA256 /a windows/packaging/musica-1.0.0.msix
          Remove-Item $pfx -Force

      - name: Upload MSIX signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: musica-windows-msix
          path: windows/packaging/musica-1.0.0.msix
          if-no-files-found: error

      - name: Upload Windows exe bundle
        uses: actions/upload-artifact@v4
        with:
          name: musica-windows-x64
          path: build/windows/x64/runner/Release

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musica-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  linux-bundle:
    name: Linux bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libjson-glib-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: musica-linux-x64
          path: build/linux/x64/release/bundle