name: Build Windows (MSVC), Android y Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # uses Visual Studio 2022 (MSVC) preinstalado en el runner
      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: musica-windows-x64
          path: build/windows/x64/runner/Release

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musica-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  linux-bundle:
    name: Linux bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: musica-linux-x64
          path: build/linux/x64/release/bundle